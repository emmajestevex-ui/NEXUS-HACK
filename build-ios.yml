name: Build GREEG APP IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-15
    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Mostrar version de Xcode
        run: xcodebuild -version

      - name: Mostrar schemes disponibles
        run: xcodebuild -project ThreeOneOSFive.xcodeproj -list

      - name: Compilar GREEG APP
        run: |
          set -euo pipefail
          set +e
          xcodebuild \
            -project ThreeOneOSFive.xcodeproj \
            -scheme 3105 \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            SWIFT_OPTIMIZATION_LEVEL="-Onone" \
            SWIFT_COMPILATION_MODE=singlefile \
            build 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "----- Swift/Xcode errors -----"
            grep -nE "error:|warning:|CompileSwift|SwiftCompile" build.log || true
            echo "----- Last 160 lines -----"
            tail -n 160 build.log || true
            exit "$status"
          fi

      - name: Buscar aplicacion compilada
        run: |
          set -euo pipefail
          find build -type d -name "*.app" -print

      - name: Crear IPA unsigned
        run: |
          set -euo pipefail
          APP_PATH="$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -type d | head -n 1)"
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No se encontro la aplicacion compilada."
            exit 1
          fi
          rm -rf Payload GREEG_APP_unsigned.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r GREEG_APP_unsigned.ipa Payload
          ls -lh GREEG_APP_unsigned.ipa

      - name: Subir IPA
        uses: actions/upload-artifact@v4
        with:
          name: GREEG-APP-unsigned
          path: GREEG_APP_unsigned.ipa
          if-no-files-found: error
          retention-days: 30
