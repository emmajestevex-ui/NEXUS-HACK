name: Build iOS and publish admin panel

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: nexus-pages
  cancel-in-progress: true

jobs:
  ios-unsigned-ipa:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build unsigned iOS device app
        run: >-
          xcodebuild -project NexusCommunity.xcodeproj
          -scheme NexusCommunity
          -destination 'generic/platform=iOS'
          -configuration Release
          -derivedDataPath build/DerivedData
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= build
      - name: Package unsigned IPA and admin bundle
        run: |
          mkdir -p package/Payload _site/assets
          ditto build/DerivedData/Build/Products/Release-iphoneos/NexusCommunity.app package/Payload/NexusCommunity.app
          ditto -c -k --sequesterRsrc package/Payload NEXUS-HACK-unsigned.ipa
          cp -R admin/. _site/
          cp NexusCommunity/Assets.xcassets/NexusWolf.imageset/nexus-wolf.png _site/assets/nexus-wolf.png
          sed -i '' 's#../NexusCommunity/Assets.xcassets/NexusWolf.imageset/nexus-wolf.png#./assets/nexus-wolf.png#g' _site/index.html
          cd _site && /usr/bin/zip -qry ../nexus-community-admin.zip .
      - name: Publish direct-download release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nexus-build-${{ github.run_number }}
          name: NEXUS HACK build ${{ github.run_number }}
          body: >-
            IPA de dispositivo sin firmar. Impórtala en ESign y fírmala con un
            certificado P12 y perfil mobileprovision propios y compatibles.
          files: |
            NEXUS-HACK-unsigned.ipa
            nexus-community-admin.zip
            supabase/schema.sql
          fail_on_unmatched_files: true

  admin-pages:
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -R admin/. _site/
          mkdir -p _site/assets
          cp NexusCommunity/Assets.xcassets/NexusWolf.imageset/nexus-wolf.png _site/assets/nexus-wolf.png
          sed -i 's#../NexusCommunity/Assets.xcassets/NexusWolf.imageset/nexus-wolf.png#./assets/nexus-wolf.png#g' _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
