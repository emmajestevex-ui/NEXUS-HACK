name: Build iOS and publish admin panel

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: nexus-pages
  cancel-in-progress: true

jobs:
  ios-simulator-build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build unsigned iOS simulator app
        run: >-
          xcodebuild -project NexusCommunity.xcodeproj
          -scheme NexusCommunity
          -sdk iphonesimulator
          -configuration Release
          -derivedDataPath build/DerivedData
          CODE_SIGNING_ALLOWED=NO build
      - uses: actions/upload-artifact@v4
        with:
          name: nexus-community-ios-simulator-unsigned
          path: build/DerivedData/Build/Products/Release-iphonesimulator/NexusCommunity.app
          if-no-files-found: error

  admin-pages:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -R admin/. _site/
          mkdir -p _site/assets
          cp NexusCommunity/Assets.xcassets/NexusWolf.imageset/nexus-wolf.png _site/assets/nexus-wolf.png
          sed -i 's#../NexusCommunity/Assets.xcassets/NexusWolf.imageset/nexus-wolf.png#./assets/nexus-wolf.png#g' _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
