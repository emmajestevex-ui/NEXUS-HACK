name: Build NEXUS HACK IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-15

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Mostrar versión de Xcode
        run: xcodebuild -version

      - name: Mostrar schemes disponibles
        run: xcodebuild -project ThreeOneOSFive.xcodeproj -list

      - name: Configurar desbloqueo automático de .3105
        env:
          NEXUS_3105_PASSWORD: ${{ secrets.NEXUS_3105_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${NEXUS_3105_PASSWORD:-}" ]; then
            echo "::error::Falta configurar el secreto NEXUS_3105_PASSWORD en Settings > Secrets and variables > Actions."
            exit 1
          fi
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          # Inject only inside the macOS runner's temporary checkout.
          # Never commit the password or print its value in workflow logs.
          source = Path("ThreeOneOSFive/ContentView.swift")
          data = source.read_text(encoding="utf-8")
          placeholder = '"__NEXUS_3105_PASSWORD_PLACEHOLDER__"'
          if data.count(placeholder) != 1:
              raise SystemExit("Missing or repeated .3105 password placeholder")
          password = os.environ["NEXUS_3105_PASSWORD"]
          if not password or len(password) > 1024:
              raise SystemExit("Invalid .3105 secret length")
          source.write_text(data.replace(placeholder, json.dumps(password, ensure_ascii=True)), encoding="utf-8")
          print(".3105 automatic unlock configured without exposing the password")
          PY

      - name: Compilar NEXUS HACK
        run: |
          set -o pipefail
          xcodebuild \
            -project ThreeOneOSFive.xcodeproj \
            -scheme 3105 \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee xcodebuild.log

      - name: Mostrar errores de Xcode
        if: failure()
        run: |
          if [ -f xcodebuild.log ]; then
            grep -Ei "error:|fatal error:" xcodebuild.log | tail -80 | while IFS= read -r line; do
              printf '::error::%s\n' "$line"
            done
          fi

      - name: Buscar aplicación compilada
        run: |
          echo "Buscando .app..."
          find build -type d -name "*.app" -print

      - name: Crear IPA unsigned
        run: |
          APP_PATH=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -type d -name "*.app" | head -1)

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No se encontró la aplicación compilada."
            exit 1
          fi

          echo "App encontrada en: $APP_PATH"

          mkdir -p Payload
          cp -R "$APP_PATH" Payload/

          zip -r NEXUS_HACK_unsigned.ipa Payload

          echo "IPA creada correctamente:"
          ls -lh NEXUS_HACK_unsigned.ipa

      - name: Subir IPA
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-HACK-unsigned
          path: NEXUS_HACK_unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Empaquetar panel admin
        run: |
          set -euo pipefail
          zip -r NEXUS_HACK_ADMIN_panel.zip admin supabase/remote_content_setup.sql supabase/licenses_setup.sql supabase/admin_emails_setup.sql
          ls -lh NEXUS_HACK_ADMIN_panel.zip

      - name: Subir panel admin
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-HACK-admin-panel
          path: NEXUS_HACK_ADMIN_panel.zip
          if-no-files-found: error
          retention-days: 30

      - name: Empaquetar panel de keys
        run: |
          set -euo pipefail
          zip -r NEXUS_HACK_KEYS_panel.zip admin supabase/licenses_setup.sql supabase/admin_emails_setup.sql
          ls -lh NEXUS_HACK_KEYS_panel.zip

      - name: Subir panel de keys
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-HACK-keys-panel
          path: NEXUS_HACK_KEYS_panel.zip
          if-no-files-found: error
          retention-days: 30
