<title>NEXUS IOS - Intro</title>
<style>
  :root { --bg:#05060b; --size:min(68vmin,440px); }
  *{box-sizing:border-box;margin:0}
  html,body{height:100%;background:transparent;overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  #fx{position:fixed;inset:0;width:100%;height:100%;opacity:0;transition:opacity 1.2s ease;
    -webkit-mask-image:radial-gradient(ellipse at 50% 60%,#000 25%,transparent 85%);
            mask-image:radial-gradient(ellipse at 50% 60%,#000 25%,transparent 85%)}
  #fx.on{opacity:.75}
  #fx.off{opacity:0}
  #stage{position:fixed;inset:0;display:grid;place-items:center;perspective:1500px;transition:opacity .6s ease}
  #stage.out{opacity:0}

  .glow{position:absolute;width:calc(var(--size)*1.8);height:calc(var(--size)*1.8);border-radius:50%;
    background:radial-gradient(circle,rgba(13,120,255,.34) 0%,rgba(13,120,255,.12) 40%,transparent 68%);
    opacity:0;filter:blur(6px)}

  .holder{position:relative;width:var(--size);height:var(--size);transform-style:preserve-3d;opacity:0}
  .logo{position:absolute;inset:0;transform-style:preserve-3d}
  .layer{position:absolute;inset:0}
  .layer img{width:100%;height:100%;display:block;object-fit:contain;user-select:none;-webkit-user-drag:none}

  .name{position:absolute;bottom:8vh;left:0;right:0;text-align:center;color:#fff;
    font-weight:800;letter-spacing:.42em;font-size:clamp(16px,4vmin,26px);opacity:0;padding-left:.42em;white-space:pre;
    text-shadow:0 0 18px rgba(30,140,255,.75)}
  .name i{font-style:normal;color:#2ea8ff}

  #replay{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:none;border:1px solid #333;
    color:#8a8a96;padding:9px 18px;border-radius:999px;font:inherit;font-size:13px;cursor:pointer;opacity:0;pointer-events:none;transition:opacity .4s}
  #replay.show{opacity:1;pointer-events:auto}
  #replay:hover{color:#fff;border-color:#2ea8ff}
</style>
</head>
